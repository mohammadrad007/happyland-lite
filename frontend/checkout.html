<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تکمیل خرید | Happy Land Lite</title>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("hl_theme");
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme = saved || (systemDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
  </head>
  <body>
    <header class="site-header"></header>

    <div class="max-w-6xl mx-auto px-5">
      <nav id="breadcrumb" aria-label="مسیر صفحه"></nav>
    </div>

    <main class="max-w-6xl mx-auto px-5 pb-10">
      <!-- ⬇️ مراحل -->
      <div class="checkout-steps" id="checkoutSteps">
        <div class="checkout-step-item active">
          <div class="checkout-step-circle">1</div>
          <div class="checkout-step-label">اطلاعات ارسال</div>
        </div>
        <div class="checkout-step-line"></div>
        <div class="checkout-step-item">
          <div class="checkout-step-circle">2</div>
          <div class="checkout-step-label">پرداخت</div>
        </div>
        <div class="checkout-step-line"></div>
        <div class="checkout-step-item">
          <div class="checkout-step-circle">3</div>
          <div class="checkout-step-label">تایید</div>
        </div>
      </div>

      <!-- ⬇️ Layout -->
      <div class="checkout-layout" id="checkoutLayout">
        <!-- فرم اطلاعات -->
        <form class="checkout-form-card" id="checkoutForm">
          <div class="checkout-card-header">
            <div class="checkout-card-icon">📦</div>
            <div>
              <h2 class="checkout-card-title">اطلاعات ارسال</h2>
              <p class="checkout-card-sub">سفارش خود را به کجا ارسال کنیم؟</p>
            </div>
          </div>

          <div class="form-field">
            <label for="name">نام و نام خانوادگی</label>
            <div class="checkout-input-wrap">
              <svg
                class="checkout-input-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                type="text"
                id="name"
                required
                placeholder="مثلاً علی رضایی"
              />
            </div>
          </div>

          <div class="form-field">
            <label for="phone">شماره تماس</label>
            <div class="checkout-input-wrap">
              <svg
                class="checkout-input-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                ></path>
              </svg>
              <input
                type="tel"
                id="phone"
                required
                placeholder="09123456789"
                dir="rtl"
              />
            </div>
          </div>

          <div class="form-field">
            <label for="address">آدرس کامل</label>
            <div class="checkout-input-wrap checkout-textarea-wrap">
              <svg
                class="checkout-input-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <textarea
                id="address"
                rows="3"
                required
                placeholder="استان، شهر، خیابان، پلاک، واحد"
              ></textarea>
            </div>
          </div>

          <button
            type="submit"
            class="btn-brand checkout-submit"
            id="submitBtn"
          >
            <span>ادامه و پرداخت</span>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <div class="checkout-trust">
            <div class="checkout-trust-item">
              <span>🔒</span>
              <span>پرداخت امن</span>
            </div>
            <div class="checkout-trust-item">
              <span>🚚</span>
              <span>ارسال سریع</span>
            </div>
            <div class="checkout-trust-item">
              <span>🔄</span>
              <span>۷ روز بازگشت</span>
            </div>
          </div>
        </form>

        <!-- خلاصه سفارش -->
        <aside class="checkout-summary">
          <div class="checkout-card-header">
            <div class="checkout-card-icon">🛍</div>
            <div>
              <h2 class="checkout-card-title">خلاصه سفارش</h2>
              <p class="checkout-card-sub" id="summaryCount"></p>
            </div>
          </div>

          <div id="summaryItems" class="checkout-items"></div>

          <!-- کد تخفیف -->
          <div class="coupon-section">
            <label class="coupon-label">کد تخفیف دارید؟</label>
            <div class="coupon-input-wrap">
              <input
                type="text"
                id="couponInput"
                class="coupon-input"
                placeholder="مثلاً HAPPY20"
                autocomplete="off"
              />
              <button type="button" id="couponApplyBtn" class="coupon-btn">
                اعمال
              </button>
            </div>
            <div id="couponMessage" class="coupon-message"></div>
          </div>

          <!-- جمع‌بندی -->
          <div class="checkout-totals">
            <div class="checkout-total-row">
              <span>جمع سبد</span>
              <span id="summaryTotal">0 تومان</span>
            </div>

            <div
              id="discountRow"
              class="checkout-total-row checkout-total-discount hidden"
            >
              <span>تخفیف (<span id="discountCode"></span>)</span>
              <span id="discountAmount">0 تومان</span>
            </div>

            <div class="checkout-total-row checkout-total-final">
              <span>مبلغ قابل پرداخت</span>
              <span id="finalTotal" class="text-brand">0 تومان</span>
            </div>
          </div>
        </aside>
      </div>

      <!-- حالت خالی (اگه سبد خالی بود) -->
      <div id="emptyCartBox" class="hidden"></div>
    </main>

    <footer class="site-footer"></footer>

    <script type="module">
      import "./js/main.js";
      import "./js/checkout.js";
      import { renderFooter } from "./js/footer.js";
      import { renderSimpleBreadcrumb } from "./js/breadcrumb.js";

      renderFooter();
      renderSimpleBreadcrumb("تکمیل خرید");
    </script>
  </body>
</html>
