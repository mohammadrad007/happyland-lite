<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محصولات | Happy Land Lite</title>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("hl_theme");
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme = saved || (systemDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
  </head>
  <body>
    <header class="site-header"></header>
    <div class="max-w-6xl mx-auto px-5">
      <nav id="breadcrumb" aria-label="مسیر صفحه"></nav>
    </div>
    <main class="max-w-6xl mx-auto px-5">
      <h1 class="text-2xl font-bold my-8">همه محصولات</h1>
      <div class="search-box-wrap">
        <div class="search-box">
          <svg
            class="search-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="جستجوی محصول..."
          />
          <button
            id="searchClear"
            class="search-clear hidden"
            aria-label="پاک کردن"
          >
            ✕
          </button>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 mb-4" id="filters">
        <button class="filter-btn" data-cat="all">همه</button>
        <button class="filter-btn" data-cat="women">زنانه</button>
        <button class="filter-btn" data-cat="men">مردانه</button>
        <button class="filter-btn" data-cat="girls">دخترانه</button>
        <button class="filter-btn" data-cat="boys">پسرانه</button>
        <button class="filter-btn" data-cat="baby">نوزادی</button>
      </div>

      <div class="filter-panel" id="pricePanel">
        <div class="form-field">
          <label>حداقل قیمت (تومان)</label>
          <input
            type="number"
            id="minPrice"
            min="0"
            placeholder="مثلاً 300000"
          />
        </div>
        <div class="form-field">
          <label>حداکثر قیمت (تومان)</label>
          <input
            type="number"
            id="maxPrice"
            min="0"
            placeholder="مثلاً 2000000"
          />
        </div>
        <div class="form-field">
          <label>مرتب‌سازی</label>
          <select id="sortBy">
            <option value="">پیش‌فرض</option>
            <option value="price-asc">ارزان‌ترین</option>
            <option value="price-desc">گران‌ترین</option>
            <option value="discount">بیشترین تخفیف</option>
          </select>
        </div>
        <button class="btn-brand" id="applyFilter">اعمال فیلتر</button>
        <button class="btn-outline" id="resetFilter">پاک کردن</button>
      </div>
      <div id="resultsInfo" class="results-info"></div>
      <div class="product-grid" id="productGrid"></div>
    </main>
    <!-- ⬇️ بخش اخیراً دیدید -->
    <section
      class="recently-section"
      id="recentlySection"
      style="display: none"
    >
      <div class="max-w-6xl mx-auto px-5">
        <h2 class="recently-title">اخیراً دیدید</h2>
        <div class="recently-slider" data-recently-grid></div>
      </div>
    </section>
    <div class="cart-overlay" id="cartOverlay"></div>

    <aside class="cart-sidebar" id="cartSidebar">
      <h3 class="font-bold text-lg mb-4">سبد خرید</h3>
      <div id="cartItems" class="flex-1 overflow-y-auto"></div>
      <div id="cartTotal" class="py-4 font-bold border-t border-base">
        جمع: 0 تومان
      </div>
      <a href="checkout.html" class="btn-brand w-full">ادامه خرید</a>
    </aside>

    <footer class="site-footer"></footer>
    <script type="module">
      import "./js/main.js";
      import "./js/products.js";
      import { renderFooter } from "./js/footer.js";
      import { renderSimpleBreadcrumb } from "./js/breadcrumb.js";

      renderFooter();
      renderSimpleBreadcrumb("محصولات");
    </script>
  </body>
</html>
