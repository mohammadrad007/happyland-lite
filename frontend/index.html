<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Land Lite | خانه</title>
    <script>
      (function () {
        const saved = localStorage.getItem("hl_theme");
        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme = saved || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
  </head>
  <body>
    <header class="site-header"></header>

    <main class="max-w-6xl mx-auto px-5">
      <!-- Hero -->
      <section class="bg-brand-light rounded-2xl my-8 py-16 px-5 text-center">
        <h1 class="text-3xl md:text-4xl font-bold mb-3">
          به Happy Land Lite خوش آمدید
        </h1>
        <p class="text-muted mb-6">پوشاک مینیمال برای زن، مرد، کودک و نوزاد</p>
        <a href="products.html" class="btn-brand">مشاهده محصولات</a>
      </section>

      <!-- ⬇️⬇️ بخش پیشنهادات ویژه ⬇️⬇️ -->
      <section class="deals-section" dir="rtl">
        <!-- بنر کنار -->
        <div class="deals-banner">
          <div class="deals-banner-inner">
            <div class="deals-title">پیشنهاد<br /><span>شگفت‌انگیز</span></div>
            <div class="deals-fire">🔥</div>
            <a href="products.html?sort=discount" class="deals-more">
              مشاهده همه
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </a>
          </div>
        </div>

        <!-- اسلایدر محصولات -->
        <div class="deals-slider-wrap">
          <button
            class="deals-arrow deals-arrow-next"
            id="dealsNext"
            aria-label="بعدی"
          >
            ›
          </button>
          <button
            class="deals-arrow deals-arrow-prev"
            id="dealsPrev"
            aria-label="قبلی"
          >
            ‹
          </button>
          <div class="deals-slider" id="dealsSlider">
            <!-- JS پر می‌کنه -->
          </div>
        </div>
      </section>

      <!-- Featured -->
      <h2 class="text-xl font-bold mb-4 mt-8">محصولات ویژه</h2>
      <div class="product-grid" id="featuredGrid"></div>

      <a href="checkout.html" class="promo-banner-image">
        <img
          src="assets/banner.webp"
          alt="پرداخت امن با Happy Land Lite"
          loading="lazy"
        />
      </a>

      <!-- ⬇️ اخیراً دیدید -->
      <section
        class="recently-section"
        id="recentlySection"
        style="display: none; margin-top: 40px"
      >
        <h2 class="recently-title">اخیراً دیدید</h2>
        <div class="recently-slider" data-recently-grid></div>
      </section>
    </main>

    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-sidebar" id="cartSidebar">
      <h3 class="font-bold text-lg mb-4">سبد خرید</h3>
      <div id="cartItems" class="flex-1 overflow-y-auto"></div>
      <div id="cartTotal" class="py-4 font-bold border-t border-base">
        جمع: 0 تومان
      </div>
      <a href="checkout.html" class="btn-brand w-full">ادامه خرید</a>
    </aside>

    <footer class="site-footer"></footer>

    <script type="module">
      import "./js/main.js";
      import "./js/products.js";
      import "./js/deals.js";
      import { renderFooter } from "./js/footer.js";
      renderFooter();
      import { renderRecentlyViewed } from "./js/ui.js";
      // ... بقیه import ها

      // بعد از DOMContentLoaded یا در انتهای اسکریپت
      const recentlyEl = document.getElementById("recentlySection");
      if (recentlyEl) {
        renderRecentlyViewed(recentlyEl.querySelector("[data-recently-grid]"));
        const grid = recentlyEl.querySelector("[data-recently-grid]");
        if (grid && !grid.innerHTML.trim()) {
          recentlyEl.style.display = "none";
        }
      }
    </script>
  </body>
</html>
