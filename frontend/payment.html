<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پرداخت | Happy Land Lite</title>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("hl_theme");
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme = saved || (systemDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
  </head>
  <body>
    <header class="site-header"></header>

    <main class="max-w-3xl mx-auto px-5 pb-10">
      <!-- ⬇️ مراحل -->
      <div class="checkout-steps">
        <div class="checkout-step-item done">
          <div class="checkout-step-circle">✓</div>
          <div class="checkout-step-label">اطلاعات</div>
        </div>
        <div class="checkout-step-line"></div>
        <div class="checkout-step-item active">
          <div class="checkout-step-circle">2</div>
          <div class="checkout-step-label">پرداخت</div>
        </div>
        <div class="checkout-step-line"></div>
        <div class="checkout-step-item">
          <div class="checkout-step-circle">3</div>
          <div class="checkout-step-label">تایید</div>
        </div>
      </div>

      <!-- ⬇️ کارت درگاه -->
      <div class="payment-card">
        <!-- هدر درگاه -->
        <div class="payment-gateway-header">
          <div class="payment-gateway-logo">🔐</div>
          <div>
            <h2 class="payment-gateway-title">درگاه پرداخت امن</h2>
            <p class="payment-gateway-sub">Happy Land Lite · شبیه‌سازی</p>
          </div>
          <div class="payment-gateway-badge">امن</div>
        </div>

        <!-- اطلاعات سفارش -->
        <div class="payment-info-box">
          <div class="payment-info-row">
            <span>کد سفارش</span>
            <span id="orderId" class="font-bold"></span>
          </div>
          <div class="payment-info-row">
            <span>گیرنده</span>
            <span id="orderRecipient" class="font-bold">—</span>
          </div>
          <div id="subtotalRow" class="payment-info-row hidden">
            <span>جمع سبد</span>
            <span id="orderSubtotal"></span>
          </div>
          <div
            id="discountRow"
            class="payment-info-row payment-info-discount hidden"
          >
            <span>تخفیف (<span id="orderCoupon"></span>)</span>
            <span id="orderDiscount"></span>
          </div>
          <div class="payment-info-row payment-info-total">
            <span>مبلغ قابل پرداخت</span>
            <span id="orderTotal"></span>
          </div>
        </div>

        <!-- پیام خطا (پنهان) -->
        <div id="paymentError" class="payment-error hidden"></div>

        <!-- دکمه‌ها -->
        <div class="payment-actions">
          <button id="payBtn" class="payment-btn payment-btn-success">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 11l3 3L22 4"></path>
              <path
                d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
              ></path>
            </svg>
            <span>پرداخت موفق</span>
          </button>

          <button id="failBtn" class="payment-btn payment-btn-fail">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <span>پرداخت ناموفق (تست)</span>
          </button>
        </div>

        <!-- لینک انصراف -->
        <button id="cancelBtn" class="payment-cancel">
          ← انصراف و بازگشت به فروشگاه
        </button>

        <!-- Trust footer -->
        <div class="payment-trust">
          <div class="payment-trust-item">
            <span>🔒</span>
            <span>SSL/TLS</span>
          </div>
          <div class="payment-trust-item">
            <span>💳</span>
            <span>پرداخت امن</span>
          </div>
          <div class="payment-trust-item">
            <span>↩</span>
            <span>بازگشت ۷ روزه</span>
          </div>
        </div>
      </div>

      <p class="payment-note">
        💡 این یک درگاه شبیه‌سازی‌شده برای پروژه‌ی دانشگاهی است. هیچ تراکنش
        واقعی انجام نمی‌شود.
      </p>
    </main>

    <footer class="site-footer"></footer>

    <script type="module">
      import "./js/main.js";
      import "./js/payment.js";
      import { renderFooter } from "./js/footer.js";

      renderFooter();
    </script>
  </body>
</html>
